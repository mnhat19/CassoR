name: Keep Render Alive

on:
  schedule:
    # Ping every 14 minutes to prevent Render free-tier spin-down (15 min timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping backend
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://cassor.onrender.com/api/v1/explore/expertises)
          echo "Response status: $STATUS"
          # 401 = server is up (endpoint requires auth), anything else logged for info
          if [ "$STATUS" = "000" ]; then
            echo "WARNING: No response — server may still be cold-starting"
          fi
